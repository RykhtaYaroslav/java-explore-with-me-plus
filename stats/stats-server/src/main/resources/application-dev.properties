spring.application.name=stats-server
server.port=9090

# Always initialize the database using SQL scripts
spring.sql.init.mode=always

# PostgreSQL Configuration
# Connect to PostgreSQL running on localhost, port 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/stats
spring.datasource.username=stats
spring.datasource.password=stats
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
spring:
  application:
    name: stats-server
  datasource:
    url: 'jdbc:h2:mem:stats_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL'
    username: stats
    password: stats
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 9090

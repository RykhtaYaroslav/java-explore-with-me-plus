spring.application.name=main-service
server.port=8080
# Stats ru.practicum.stats.StatsServerApplication Integration
stats-server.url=http://localhost:9090
# H2 Configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ewm_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=main
spring.datasource.password=main
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
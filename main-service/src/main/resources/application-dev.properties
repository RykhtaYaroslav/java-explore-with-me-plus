spring.application.name=main-service
server.port=8080

# Always initialize the database using schema.sql
spring.sql.init.mode=always

# PostgreSQL Configuration
# Use localhost and the default PostgreSQL port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/ewm
spring.datasource.username=main
spring.datasource.password=main
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

# Stats Server Integration
# Use localhost and port 9090
stats-server.url=http://localhost:9090

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Disable Hibernate SQL output and reduce logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Enable HTTP request logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Default logging level
logging.level.root=INFO

# Enable DEBUG logging for application packages
logging.level.ru.practicum.main=DEBUG
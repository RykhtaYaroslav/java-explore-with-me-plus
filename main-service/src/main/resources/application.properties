spring.profiles.active=test
spring.application.name=main-service
server.port=8080

# Always initialize the database using SQL scripts
spring.sql.init.mode=always

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ewm
spring.datasource.username=main
spring.datasource.password=main
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# Stats Server Integration
stats-server.url=http://stats-server:9090

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Reduce Hibernate logging
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Enable HTTP request logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Default logging level
logging.level.root=INFO

# Enable DEBUG logging for application packages
logging.level.ru.practicum.main=DEBUG
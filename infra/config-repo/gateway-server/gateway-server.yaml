spring:
  cloud:
    gateway:
      routes:
        - id: stats
          uri: lb://stats-server
          predicates:
            - Path=/hit,/stats,/stats/**

        - id: main
          uri: lb://main-service
          predicates:
            - Path=/compilations,/compilations/**,/admin/compilations,/admin/compilations/**,/events,/events/**,/admin/events,/admin/events/**,/users/**,/categories,/categories/**,/admin/categories,/admin/categories/**,/admin/users,/admin/users/**,/rating/**
server:
  port: 8080